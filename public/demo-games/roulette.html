<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Demo roulette</title><link rel="stylesheet" href="demo.css"></head>
<body>
<h1 id="title"></h1>
<div class="wheel" id="wheel">–</div>
<div class="msg" id="msg"></div>
<div class="row" id="types"></div>
<div class="row"><label>#<input type="number" id="num" min="0" max="36" value="7"></label><span id="stakes" class="row"></span></div>
<button id="spin"></button>
<script src="wallet.js"></script>
<script>
  var L = { title: { en: 'European Roulette', ka: 'ევროპული რულეტი', ru: 'Европейская рулетка' }, spin: { en: 'Spin', ka: 'დატრიალება', ru: 'Крутить' },
    red: { en: 'Red', ka: 'წითელი', ru: 'Красное' }, black: { en: 'Black', ka: 'შავი', ru: 'Чёрное' }, odd: { en: 'Odd', ka: 'კენტი', ru: 'Нечёт' }, even: { en: 'Even', ka: 'ლუწი', ru: 'Чёт' }, number: { en: 'Number', ka: 'ნომერი', ru: 'Число' },
    win: { en: 'You won', ka: 'მოგება', ru: 'Выигрыш' }, lose: { en: 'No win', ka: 'წაგება', ru: 'Без выигрыша' }, low: { en: 'Not enough balance', ka: 'არასაკმარისი ბალანსი', ru: 'Недостаточно средств' } };
  var REDS = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
  var colour = function (n) { return n === 0 ? 'green' : REDS.indexOf(n) >= 0 ? 'red' : 'black'; };
  var TYPES = { red: function (n) { return colour(n) === 'red'; }, black: function (n) { return colour(n) === 'black'; }, odd: function (n) { return n > 0 && n % 2 === 1; }, even: function (n) { return n > 0 && n % 2 === 0; }, number: null };
  var type = 'red', stake = 5, busy = false, wheel = document.getElementById('wheel'), msg = document.getElementById('msg');
  document.getElementById('title').textContent = Wallet.t(L.title);
  document.getElementById('spin').textContent = Wallet.t(L.spin);
  function choose(container, values, label, onPick, initial) {
    values.forEach(function (v) {
      var b = document.createElement('button'); b.textContent = label(v); if (v === initial) b.className = 'on';
      b.onclick = function () { onPick(v); container.querySelectorAll('button').forEach(function (x) { x.className = x === b ? 'on' : ''; }); };
      container.appendChild(b);
    });
  }
  choose(document.getElementById('types'), Object.keys(TYPES), function (v) { return Wallet.t(L[v]); }, function (v) { type = v; }, type);
  choose(document.getElementById('stakes'), [1, 5, 25], String, function (v) { stake = v; }, stake);
  document.getElementById('spin').onclick = function () {
    if (busy) return; busy = true; msg.textContent = '';
    var picked = Math.min(36, Math.max(0, Math.floor(Number(document.getElementById('num').value) || 0)));
    Wallet.bet(stake).then(function (r) {
      if (!r.ok) { msg.textContent = Wallet.t(L.low); busy = false; return; }
      var n = Math.floor(Math.random() * 37), frames = 0;
      var timer = setInterval(function () {
        var shown = frames < 14 ? Math.floor(Math.random() * 37) : n;
        wheel.textContent = shown; wheel.className = 'wheel ' + colour(shown);
        if (++frames < 15) return;
        clearInterval(timer);
        var win = type === 'number' ? (n === picked ? stake * 36 : 0) : TYPES[type](n) ? stake * 2 : 0;
        var done = function () { msg.textContent = win ? Wallet.t(L.win) + ' ' + win : Wallet.t(L.lose); busy = false; };
        if (win) Wallet.payout(win).then(done); else done();
      }, 110);
    });
  };
</script>
</body></html>
